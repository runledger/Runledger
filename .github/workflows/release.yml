name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v0.1.1)
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Select release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.value }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require the tag to match the package version
        id: version
        shell: bash
        run: |
          tag="${{ steps.tag.outputs.value }}"
          case "$tag" in
            v*) version="${tag#v}" ;;
            *)
              echo "Release tag must look like v0.2.4, got: ${tag}"
              exit 1
              ;;
          esac
          package="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$package" != "$version" ]; then
            echo "Tag ${tag} does not match pyproject version ${package}."
            echo "The release tag and pyproject.toml must identify the same version."
            exit 1
          fi
          echo "Tag ${tag} matches package version ${package}."
          echo "version=${package}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
          python - <<'PY'
          import pathlib
          import tomllib

          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          names = sorted(path.name for path in pathlib.Path("dist").iterdir())
          if not names:
              raise SystemExit("dist/ is empty; refusing to publish")
          missing = [name for name in names if version not in name]
          if missing:
              raise SystemExit(f"dist files missing version {version}: {missing}")
          print("Publishing", ", ".join(names))
          PY
      - name: Generate release notes
        run: |
          cat CHANGELOG.md > release_notes.md
          echo "" >> release_notes.md
          echo "Demo: https://github.com/ZackMitchell910/runledger-demo/pull/1" >> release_notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          files: dist/*
          body_path: release_notes.md
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  verify-published:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify the published package in a clean environment
        env:
          RUNLEDGER_VERSION: ${{ needs.publish.outputs.version }}
        shell: bash
        run: python scripts/smoke_published.py --version "$RUNLEDGER_VERSION"
      - name: Run the released action with the exact published package
        id: released-action
        uses: ./
        with:
          path: examples/evals/demo
          baseline: baselines/demo.json
          python-version: ${{ matrix.python }}
          package: runledger==${{ needs.publish.outputs.version }}
          upload-artifacts: "false"
      - name: Verify action outputs
        env:
          RESULT: ${{ steps.released-action.outputs.result }}
          EXIT_CODE: ${{ steps.released-action.outputs.exit-code }}
          ARTIFACTS_PATH: ${{ steps.released-action.outputs.artifacts-path }}
        shell: bash
        run: |
          test "$RESULT" = pass
          test "$EXIT_CODE" = 0
          test -d "$ARTIFACTS_PATH"
      - name: Introduce a missing required field
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("examples/evals/demo/schema.json")
          schema = json.loads(path.read_text(encoding="utf-8"))
          schema["required"].append("published_action_missing_field")
          path.write_text(json.dumps(schema), encoding="utf-8")
          PY
      - name: Confirm the released action fails on a regression
        id: released-failure
        continue-on-error: true
        uses: ./
        with:
          path: examples/evals/demo
          baseline: baselines/demo.json
          python-version: ${{ matrix.python }}
          package: runledger==${{ needs.publish.outputs.version }}
          upload-artifacts: "false"
      - name: Verify failure outputs
        env:
          OUTCOME: ${{ steps.released-failure.outcome }}
          RESULT: ${{ steps.released-failure.outputs.result }}
          EXIT_CODE: ${{ steps.released-failure.outputs.exit-code }}
          ARTIFACTS_PATH: ${{ steps.released-failure.outputs.artifacts-path }}
        shell: bash
        run: |
          test "$OUTCOME" = failure
          test "$RESULT" = fail
          test "$EXIT_CODE" = 1
          test -d "$ARTIFACTS_PATH"

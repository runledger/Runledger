name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v0.1.1)
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Select release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.value }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require the tag to match the package version
        shell: bash
        run: |
          tag="${{ steps.tag.outputs.value }}"
          case "$tag" in
            v*) version="${tag#v}" ;;
            *)
              echo "Release tag must look like v0.2.3, got: ${tag}"
              exit 1
              ;;
          esac
          package="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$package" != "$version" ]; then
            echo "Tag ${tag} does not match pyproject version ${package}."
            echo "Pushing v0.2.3 publishes runledger 0.2.3 only when pyproject.toml says 0.2.3."
            exit 1
          fi
          echo "Tag ${tag} matches package version ${package}."
      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
          python - <<'PY'
          import pathlib
          import tomllib

          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          names = sorted(path.name for path in pathlib.Path("dist").iterdir())
          if not names:
              raise SystemExit("dist/ is empty; refusing to publish")
          missing = [name for name in names if version not in name]
          if missing:
              raise SystemExit(f"dist files missing version {version}: {missing}")
          print("Publishing", ", ".join(names))
          PY
      - name: Generate release notes
        run: |
          cat CHANGELOG.md > release_notes.md
          echo "" >> release_notes.md
          echo "Demo: https://github.com/ZackMitchell910/runledger-demo/pull/1" >> release_notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          files: dist/*
          body_path: release_notes.md
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
